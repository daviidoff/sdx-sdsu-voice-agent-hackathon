[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "disaster-response-crawler"
version = "0.1.0"
description = "Bounded public facility discovery with mock data and an Apify adapter"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
disaster-crawler = "disaster_crawler.__main__:main"

[tool.setuptools.packages.find]
include = ["disaster_crawler*"]

[tool.setuptools.package-data]
disaster_crawler = ["fixtures/*.json"]
